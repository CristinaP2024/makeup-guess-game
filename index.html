<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guess the Makeup</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 620px; margin: 40px auto; padding: 20px; text-align: center; background: #fce9f1; color: #000; transition: background-color .25s ease; }
    body.flash-correct { background: #9ae6ab; }
    body.flash-wrong { background: #f7a3a3; }
    .game { padding: 24px; background: #fce9f1; border-radius: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.1); }
    #picture { height: 220px; display: grid; place-items: center; background: #f3bfd4; border-radius: 12px; margin: 20px 0; }
    #picture svg { width: 200px; height: 200px; }
    input, button { font-size: 1rem; padding: 10px; margin: 6px; color: #000; }
    input { width: 70%; box-sizing: border-box; background: #fff; border: 1px solid #000; }
    button { background: #fff; border: 1px solid #000; cursor: pointer; }
    #message { min-height: 1.5em; font-weight: bold; }
    #timer { font-weight: bold; margin: 10px 0 8px; }
  </style>
</head>
<body>
  <main class="game">
    <h1>Guess the Makeup!</h1>
    <p id="progress"></p>
    <div id="timer">Time left: 30s</div>
    <p>What type of makeup is shown?</p>
    <div id="picture" role="img" aria-label="Makeup product illustration"><span>Press Start to play!</span></div>
    <form id="answerForm">
      <input id="answer" type="text" placeholder="Type your guess" autocomplete="off" disabled>
      <button id="submitButton" type="submit" disabled>Guess</button>
    </form>
    <p id="message" aria-live="polite"></p>
    <p>Score: <span id="score">0</span></p>
    <button id="startButton" type="button">Start Game</button>
    <button id="nextButton" type="button" hidden>Next Question</button>
  </main>
  <script>
    const questions = [
      { answer: "lipstick", aliases: ["lip stick"], art: `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><rect x="69" y="95" width="62" height="72" rx="8" fill="#c2185b"/><rect x="64" y="157" width="72" height="18" rx="5" fill="#8e1748"/><path d="M75 95 L75 62 Q100 38 125 62 L125 95 Z" fill="#ed4b83"/><path d="M75 62 Q100 45 125 62" fill="none" stroke="#ad174e" stroke-width="4"/><rect x="70" y="113" width="60" height="8" fill="#f8a4c1"/></svg>` },
      { answer: "mascara", aliases: [], art: `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><rect x="55" y="75" width="76" height="28" rx="8" fill="#222"/><rect x="55" y="75" width="18" height="28" rx="5" fill="#d94b79"/><path d="M131 89 L161 89" stroke="#333" stroke-width="7"/><path d="M160 75 L160 103" stroke="#333" stroke-width="5"/><path d="M153 78 L167 78 M153 84 L167 84 M153 90 L167 90 M153 96 L167 96 M153 102 L167 102" stroke="#333" stroke-width="2"/><text x="84" y="94" font-size="12" fill="white" font-family="Arial">LASH</text></svg>` },
      { answer: "foundation", aliases: ["liquid foundation"], art: `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><rect x="77" y="60" width="46" height="16" rx="4" fill="#333"/><rect x="91" y="45" width="18" height="18" fill="#555"/><rect x="68" y="75" width="64" height="94" rx="12" fill="#d7a47c"/><rect x="75" y="91" width="50" height="48" rx="5" fill="#f3d9c2"/><text x="100" y="112" text-anchor="middle" font-size="10" fill="#704a36" font-family="Arial">SKIN</text><text x="100" y="126" text-anchor="middle" font-size="9" fill="#704a36" font-family="Arial">FOUNDATION</text></svg>` },
      { answer: "blush", aliases: ["powder blush", "rouge"], art: `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><ellipse cx="100" cy="111" rx="61" ry="49" fill="#d8d8e2"/><ellipse cx="100" cy="104" rx="61" ry="49" fill="#f4b4c6" stroke="#b65c79" stroke-width="5"/><ellipse cx="100" cy="104" rx="43" ry="33" fill="#e8799c"/><path d="M64 104 Q100 79 136 104 Q100 130 64 104" fill="#f29bb4"/><circle cx="100" cy="104" r="8" fill="#f8c5d2"/></svg>` },
      { answer: "eyeshadow", aliases: ["eye shadow", "eyeshadow palette", "eye shadow palette"], art: `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><rect x="35" y="57" width="130" height="92" rx="12" fill="#493b59"/><rect x="43" y="65" width="114" height="76" rx="8" fill="#f0d8e7"/><circle cx="64" cy="91" r="15" fill="#d889a8"/><circle cx="100" cy="91" r="15" fill="#8e6e9f"/><circle cx="136" cy="91" r="15" fill="#c8a05e"/><circle cx="64" cy="121" r="12" fill="#e9b7a3"/><circle cx="100" cy="121" r="12" fill="#76545d"/><circle cx="136" cy="121" r="12" fill="#b9a5c9"/></svg>` },
      { answer: "concealer", aliases: [], art: `<span style="font-size:100px">🧴</span>` },
      { answer: "nail polish", aliases: ["nail varnish"], art: `<span style="font-size:100px">💅</span>` },
      { answer: "makeup brush", aliases: ["brush"], art: `<span style="font-size:100px">🖌️</span>` },
      { answer: "compact powder", aliases: ["powder"], art: `<span style="font-size:100px">🪞</span>` },
      { answer: "eyeliner", aliases: ["eye liner"], art: `<span style="font-size:100px">✒️</span>` },
      { answer: "lip gloss", aliases: ["lipgloss"], art: `<span style="font-size:100px">💋</span>` },
      { answer: "setting spray", aliases: ["makeup setting spray"], art: `<span style="font-size:100px">💦</span>` },
      { answer: "highlighter", aliases: ["makeup highlighter"], art: `<span style="font-size:100px">✨</span>` },
      { answer: "makeup sponge", aliases: ["beauty sponge", "blending sponge"], art: `<span style="font-size:100px">🧽</span>` },
      { answer: "eyebrow pencil", aliases: ["brow pencil"], art: `<span style="font-size:100px">✏️</span>` },
      { answer: "primer", aliases: ["makeup primer", "face primer"], art: `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><rect x="78" y="48" width="44" height="25" rx="5" fill="#d7c6f2"/><rect x="67" y="70" width="66" height="100" rx="12" fill="#f5d9e8" stroke="#b783a0" stroke-width="4"/><text x="100" y="120" text-anchor="middle" font-size="13" fill="#222" font-family="Arial">PRIMER</text></svg>` },
      { answer: "bronzer", aliases: ["powder bronzer"], art: `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><circle cx="100" cy="105" r="58" fill="#b87345" stroke="#6e432d" stroke-width="8"/><circle cx="100" cy="105" r="43" fill="#d18a52"/><path d="M69 113 Q100 78 131 113 Q100 139 69 113" fill="#e3a76a"/><text x="100" y="112" text-anchor="middle" font-size="12" fill="#4a2d20" font-family="Arial">BRONZER</text></svg>` },
      { answer: "lip liner", aliases: ["lipliner", "lip pencil"], art: `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><path d="M45 145 L132 58 L151 77 L64 164 Z" fill="#d94b79"/><path d="M132 58 L153 37 L151 77 Z" fill="#e8c39a"/><path d="M153 37 L160 30 L157 43 Z" fill="#333"/><rect x="44" y="145" width="21" height="20" transform="rotate(-45 44 145)" fill="#f4a8c0"/><text x="100" y="188" text-anchor="middle" font-size="12" fill="#222" font-family="Arial">LIP LINER</text></svg>` },
      { answer: "false eyelashes", aliases: ["false lashes", "fake eyelashes", "false eyelash"], art: `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><path d="M34 115 Q100 60 166 115" fill="none" stroke="#222" stroke-width="7"/><path d="M39 108 L27 82 M51 98 L43 69 M64 89 L59 59 M78 81 L76 52 M92 77 L92 47 M106 77 L108 47 M120 81 L125 52 M134 89 L142 59 M148 98 L158 69 M160 108 L173 82" stroke="#222" stroke-width="4"/><text x="100" y="155" text-anchor="middle" font-size="13" fill="#222" font-family="Arial">LASHES</text></svg>` },
      { answer: "makeup remover", aliases: ["makeup cleanser", "cleansing water"], art: `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><rect x="82" y="43" width="36" height="24" rx="4" fill="#80c9d8"/><rect x="69" y="65" width="62" height="105" rx="12" fill="#c5edf0" stroke="#70aeb7" stroke-width="4"/><path d="M72 112 Q100 100 128 112 L128 155 L72 155 Z" fill="#86d5db"/><text x="100" y="96" text-anchor="middle" font-size="10" fill="#222" font-family="Arial">REMOVER</text></svg>` }
    ];

    const picture = document.getElementById("picture");
    const progress = document.getElementById("progress");
    const timerDisplay = document.getElementById("timer");
    const answerInput = document.getElementById("answer");
    const answerForm = document.getElementById("answerForm");
    const submitButton = document.getElementById("submitButton");
    const startButton = document.getElementById("startButton");
    const nextButton = document.getElementById("nextButton");
    const message = document.getElementById("message");
    const scoreDisplay = document.getElementById("score");
    const QUESTION_TIME = 30;
    let gameQuestions = [];
    let currentQuestion = 0;
    let score = 0;
    let timerInterval = null;

    function flashBackground(type) {
      document.body.classList.remove("flash-correct", "flash-wrong");
      void document.body.offsetWidth;
      document.body.classList.add(type === "correct" ? "flash-correct" : "flash-wrong");
      setTimeout(() => document.body.classList.remove("flash-correct", "flash-wrong"), 400);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    function handleAnswerResult(isCorrect, timedOut = false) {
      stopTimer();
      const item = gameQuestions[currentQuestion];
      answerInput.disabled = true;
      submitButton.disabled = true;
      if (isCorrect) {
        score++;
        scoreDisplay.textContent = score;
        message.textContent = "Correct! 🎉";
        flashBackground("correct");
      } else {
        message.textContent = timedOut ? `Time's up! It was ${item.answer}.` : `Not quite! It was ${item.answer}.`;
        flashBackground("wrong");
      }
      nextButton.textContent = currentQuestion === gameQuestions.length - 1 ? "See Final Score" : "Next Question";
      nextButton.hidden = false;
    }

    function startTimer() {
      stopTimer();
      let timeLeft = QUESTION_TIME;
      timerDisplay.textContent = `Time left: ${timeLeft}s`;
      timerInterval = setInterval(() => {
        timeLeft--;
        timerDisplay.textContent = `Time left: ${timeLeft}s`;
        if (timeLeft <= 0) handleAnswerResult(false, true);
      }, 1000);
    }

    function startGame() {
      gameQuestions = [...questions].sort(() => Math.random() - 0.5);
      currentQuestion = 0;
      score = 0;
      scoreDisplay.textContent = score;
      startButton.hidden = true;
      showQuestion();
    }

    function showQuestion() {
      const item = gameQuestions[currentQuestion];
      picture.innerHTML = item.art;
      progress.textContent = `Question ${currentQuestion + 1} of ${gameQuestions.length}`;
      answerInput.value = "";
      answerInput.disabled = false;
      submitButton.disabled = false;
      message.textContent = "";
      nextButton.hidden = true;
      answerInput.focus();
      startTimer();
    }

    startButton.addEventListener("click", startGame);
    answerForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const guess = answerInput.value.trim().toLowerCase();
      if (!guess) {
        message.textContent = "Type your guess first!";
        return;
      }
      const item = gameQuestions[currentQuestion];
      const acceptedAnswers = [item.answer, ...item.aliases].map(answer => answer.toLowerCase());
      handleAnswerResult(acceptedAnswers.includes(guess), false);
    });

    nextButton.addEventListener("click", () => {
      currentQuestion++;
      if (currentQuestion < gameQuestions.length) {
        showQuestion();
      } else {
        stopTimer();
        picture.innerHTML = "<span>Great job!</span>";
        progress.textContent = "";
        timerDisplay.textContent = "";
        message.textContent = `Game over! You scored ${score} out of ${gameQuestions.length}.`;
        nextButton.hidden = true;
        startButton.hidden = false;
        startButton.textContent = "Play Again";
      }
    });
  </script>
</body>
</html>
