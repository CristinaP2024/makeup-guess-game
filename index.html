<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cabrillo College | Guess the Makeup</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; max-width: 700px; margin: auto; padding: 32px 16px; font-family: Arial, sans-serif; text-align: center; color: #24151d; background: radial-gradient(circle at 12% 18%, #fff 0 3px, transparent 4px), linear-gradient(135deg,#fff0f6,#f3c9dc); background-size: 45px 45px, auto; }
    .game { padding: 24px; background: rgba(255,248,251,.96); border: 2px solid #fff; border-radius: 22px; box-shadow: 0 12px 35px #7b305329; }
    .college { margin: 0 0 6px; color: #813657; font-size: 1.15rem; font-weight: bold; letter-spacing: .06em; }
    h1 { margin-top: 8px; color: #54253d; }
    #picture { height: 280px; display: grid; place-items: center; overflow: hidden; background: #f7c7dc; border: 1px solid #e8a9c5; border-radius: 18px; margin: 20px 0; box-shadow: inset 0 2px 12px #fff9; }
    #picture svg { display: block; width: 100%; height: 100%; }
    input, button { font-size: 1rem; padding: 10px 13px; margin: 6px; color: #24151d; border-radius: 9px; }
    input { width: min(70%,360px); background: white; border: 1px solid #9b617b; }
    button { background: white; border: 1px solid #9b617b; cursor: pointer; }
    button:hover:not(:disabled) { background: #ffe4ef; }
    button:disabled, input:disabled { opacity: .65; cursor: not-allowed; }
    #message { min-height: 1.5em; font-weight: bold; }
    #timer { font-weight: bold; color: #71344f; }
    #feedbackFlash { position: fixed; inset: 0; z-index: 5; opacity: 0; pointer-events: none; }
    body.flash-correct #feedbackFlash { animation: greenBlink .3s ease-in-out 4; }
    body.flash-wrong #feedbackFlash { animation: redBlink .3s ease-in-out 4; }
    @keyframes greenBlink { 0%,100% { opacity:0; background:#32c759; } 50% { opacity:.58; background:#32c759; } }
    @keyframes redBlink { 0%,100% { opacity:0; background:#f04444; } 50% { opacity:.58; background:#f04444; } }
    #confetti-layer { position:fixed; inset:0; overflow:hidden; z-index:10; pointer-events:none; }
    .confetti-piece { position:absolute; top:-18px; width:10px; height:15px; border-radius:2px; animation:fall 1.8s ease-in forwards; }
    @keyframes fall { to { transform:translate3d(var(--drift),110vh,0) rotate(760deg); opacity:.15; } }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration:.01ms !important; } }
  </style>
</head>
<body>
  <div id="feedbackFlash" aria-hidden="true"></div><div id="confetti-layer" aria-hidden="true"></div>
  <main class="game">
    <p class="college">Cabrillo College</p>
    <h1>Guess the Makeup!</h1>
    <p id="progress"></p><div id="timer">Time left: 30s</div>
    <p>What type of makeup is shown?</p>
    <div id="picture" role="img" aria-label="Unlabeled makeup product illustration">Press Start to play!</div>
    <form id="answerForm"><input id="answer" type="text" placeholder="Type your guess" autocomplete="off" disabled><button id="submitButton" type="submit" disabled>Guess</button></form>
    <p id="message" aria-live="polite"></p><p>Score: <span id="score">0</span></p>
    <button id="startButton" type="button">Start Game</button><button id="nextButton" type="button" hidden>Next Question</button>
  </main>
<script>
  const questions = [
    {answer:"lipstick", aliases:["lip stick"], kind:"lipstick"},
    {answer:"mascara", aliases:[], kind:"mascara"},
    {answer:"foundation", aliases:["liquid foundation"], kind:"foundation"},
    {answer:"blush", aliases:["powder blush","rouge"], kind:"blush"},
    {answer:"eyeshadow", aliases:["eye shadow","eyeshadow palette","eye shadow palette"], kind:"eyeshadow"},
    {answer:"concealer", aliases:[], kind:"concealer"},
    {answer:"nail polish", aliases:["nail varnish"], kind:"nailpolish"},
    {answer:"makeup brush", aliases:["brush"], kind:"brush"},
    {answer:"compact powder", aliases:["powder"], kind:"compact"},
    {answer:"eyeliner", aliases:["eye liner"], kind:"eyeliner"},
    {answer:"lip gloss", aliases:["lipgloss"], kind:"lipgloss"},
    {answer:"setting spray", aliases:["makeup setting spray"], kind:"spray"},
    {answer:"highlighter", aliases:["makeup highlighter"], kind:"highlighter"},
    {answer:"makeup sponge", aliases:["beauty sponge","blending sponge"], kind:"sponge"},
    {answer:"eyebrow pencil", aliases:["brow pencil"], kind:"browpencil"},
    {answer:"primer", aliases:["makeup primer","face primer"], kind:"primer"},
    {answer:"bronzer", aliases:["powder bronzer"], kind:"bronzer"},
    {answer:"lip liner", aliases:["lipliner","lip pencil"], kind:"lipliner"},
    {answer:"false eyelashes", aliases:["false lashes","fake eyelashes","false eyelash"], kind:"lashes"},
    {answer:"makeup remover", aliases:["makeup cleanser","cleansing water"], kind:"remover"}

  const colors = {
    lipstick: ["#d92762", "#7d1837", "#f8bfd0"],
    mascara: ["#2a2a2d", "#0d1014", "#b7c7cf"],
    foundation: ["#d7b08a", "#8a5e42", "#f4d8c4"],
    blush: ["#e78fa8", "#a74b64", "#f3d5dd"],
    eyeshadow: ["#a886b4", "#694c7d", "#d7caea"],
    concealer: ["#f0d4b7", "#bb7b5d", "#fff5ee"],
    nailpolish: ["#ca2a60", "#7a173e", "#f8bfd1"],
    brush: ["#d4b28c", "#6a4e45", "#f0dbc1"],
    compact: ["#e4d5e8", "#89738e", "#f5edf6"],
    eyeliner: ["#2f2d33", "#111116", "#8d7f99"],
    lipgloss: ["#f1a0bb", "#b94b73", "#f8d7e6"],
    spray: ["#a7d8e3", "#5f8d9a", "#dff7ff"],
    highlighter: ["#f0d880", "#bf983b", "#fff5bf"],
    sponge: ["#efb1c2", "#bb6a84", "#fbe0ec"],
    browpencil: ["#8d684e", "#47352c", "#d2b599"],
    primer: ["#d7c2ef", "#8d6ab2", "#efe5fb"],
    bronzer: ["#bf7748", "#744629", "#efc3a1"],
    lipliner: ["#d24975", "#7d1d3d", "#f5bfd0"],

    const [main, dark, light] = colors[kind] || ["#d98cae", "#874765", "#fbe2ee"];

      `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" stroke="${dark}" stroke-width="3"/>`;

    const cap = (x, y, w, h, rx) =>

    switch (kind) {

        return `

            <defs>
              <linearGradient id="tubeGlow" x1="0" y1="0" x2="1" y2="1">

              <path d="M60 147L77 127" stroke="#1d2029" stroke-width="3" stroke-linecap="round"/>
              <path d="M86 143L99 120" stroke="#1d2029" stroke-width="3" stroke-linecap="round"/>
              <path d="M112 145L125 119" stroke="#1d2029" stroke-width="3" stroke-linecap="round"/>
              <path d="M136 147L149 122" stroke="#1d2029" stroke-width="3" stroke-linecap="round"/>
              <path d="M160 150L174 128" stroke="#1d2029" stroke-width="3" stroke-linecap="round"/>
            </g>
          </svg>`;

      case "remover":
        return `
          <svg viewBox="0 0 220 250" xmlns="http://www.w3.org/2000/svg">
            <rect width="220" height="250" fill="#ebf6fb"/>
            <ellipse cx="110" cy="213" rx="70" ry="10" fill="#5d7c84" opacity="0.15"/>
            <g>
              ${cap(87, 58, 46, 20, 7)}
              <path d="M70 81H150L162 192C162 201 155 208 146 208H74C65 208 58 201 58 192L70 81Z" fill="${main}" stroke="${dark}" stroke-width="3"/>
              <path d="M88 93H132" stroke="#fff" stroke-opacity="0.65" stroke-width="4" stroke-linecap="round"/>
              <path d="M79 146C96 132 124 132 141 146" fill="none" stroke="#fff" stroke-opacity="0.7" stroke-width="5" stroke-linecap="round"/>
              <circle cx="110" cy="128" r="22" fill="#dff8ff" opacity="0.5"/>
            </g>
          </svg>`;

      default:
        return `
          <svg viewBox="0 0 220 250" xmlns="http://www.w3.org/2000/svg">
            <rect width="220" height="250" fill="#f8e7ef"/>
            <rect x="71" y="75" width="78" height="120" rx="18" fill="${main}" stroke="${dark}" stroke-width="3"/>
            <rect x="83" y="52" width="54" height="30" rx="8" fill="${light}" stroke="${dark}" stroke-width="3"/>
          </svg>`;
    }
  }

  const $ = id => document.getElementById(id);
  const picture = $("picture"), progress = $("progress"), timerDisplay = $("timer"), answerInput = $("answer"), answerForm = $("answerForm"), submitButton = $("submitButton"), startButton = $("startButton"), nextButton = $("nextButton"), message = $("message"), scoreDisplay = $("score"), confettiLayer = $("confetti-layer");
  const QUESTION_TIME = 30;
  let gameQuestions = [], currentQuestion = 0, score = 0, timerInterval = null, questionComplete = false, audioContext;

  function playSound(correct){
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioContext ??= new AC();
      if (audioContext.state === "suspended") audioContext.resume();
      const now = audioContext.currentTime;
      (correct ? [659.25, 830.61, 987.77] : [220, 164.81]).forEach((hz, i) => {
        const osc = audioContext.createOscillator(), gain = audioContext.createGain(), t = now + i * (correct ? .12 : .18);
        osc.type = correct ? "sine" : "triangle";
        osc.frequency.value = hz;
        gain.gain.setValueAtTime(.0001, t);
        gain.gain.exponentialRampToValueAtTime(.12, t + .02);
        gain.gain.exponentialRampToValueAtTime(.0001, t + .22);
        osc.connect(gain);
        gain.connect(audioContext.destination);
        osc.start(t);
        osc.stop(t + .23);
      });
    } catch (e) {}
  }

  function confetti(){
    const colorsList = ["#e94f9a", "#f6c445", "#7b61c9", "#4bbf9f", "#ff7b54", "#fff"];
    for (let i = 0; i < 75; i++) {
      const p = document.createElement("span");
      p.className = "confetti-piece";
      p.style.left = Math.random() * 100 + "%";
      p.style.backgroundColor = colorsList[Math.floor(Math.random() * colorsList.length)];
      p.style.animationDelay = Math.random() * .55 + "s";
      p.style.setProperty("--drift", (Math.random() * 220 - 110) + "px");
      confettiLayer.appendChild(p);
      p.addEventListener("animationend", () => p.remove(), { once: true });
    }
  }

  function blink(correct){
    document.body.classList.remove("flash-correct", "flash-wrong");
    void document.body.offsetWidth;
    document.body.classList.add(correct ? "flash-correct" : "flash-wrong");
    setTimeout(() => document.body.classList.remove("flash-correct", "flash-wrong"), 1300);
  }

  function stopTimer(){
    clearInterval(timerInterval);
    timerInterval = null;
  }

  function result(correct, timedOut = false){
    if (questionComplete) return;
    questionComplete = true;
    stopTimer();
    const q = gameQuestions[currentQuestion];
    answerInput.disabled = true;
    submitButton.disabled = true;
    playSound(correct);
    if (correct) {
      score++;
      scoreDisplay.textContent = score;
      message.textContent = "Correct! 🎉";
      blink(true);
      confetti();
    } else {
      message.textContent = timedOut ? `Time's up! It was ${q.answer}.` : `Not quite! It was ${q.answer}.`;
      blink(false);
    }
    nextButton.textContent = currentQuestion === gameQuestions.length - 1 ? "See Final Score" : "Next Question";
    nextButton.hidden = false;
  }

  function startTimer(){
    stopTimer();
    let left = QUESTION_TIME;
    timerDisplay.textContent = `Time left: ${left}s`;
    timerInterval = setInterval(() => {
      left--;
      timerDisplay.textContent = `Time left: ${left}s`;
      if (left <= 0) result(false, true);
    }, 1000);
  }

  function showQuestion(){
    const q = gameQuestions[currentQuestion];
    picture.innerHTML = makeItem(q.kind);
    picture.setAttribute("aria-label", "Unlabeled makeup product illustration");
    progress.textContent = `Question ${currentQuestion + 1} of ${gameQuestions.length}`;
    answerInput.value = "";
    answerInput.disabled = false;
    submitButton.disabled = false;
    message.textContent = "";
    nextButton.hidden = true;
    questionComplete = false;
    answerInput.focus();
    startTimer();
  }

  startButton.addEventListener("click", () => {
    gameQuestions = [...questions].sort(() => Math.random() - 0.5);
    currentQuestion = 0;
    score = 0;
    scoreDisplay.textContent = score;
    startButton.hidden = true;
    showQuestion();
  });

  answerForm.addEventListener("submit", e => {
    e.preventDefault();
    const guess = answerInput.value.trim().toLowerCase();
    if (!guess) {
      message.textContent = "Type your guess first!";
      return;
    }
    const q = gameQuestions[currentQuestion];
    result([q.answer, ...q.aliases].map(a => a.toLowerCase()).includes(guess));
  });

  nextButton.addEventListener("click", () => {
    currentQuestion++;
    if (currentQuestion < gameQuestions.length) {
      showQuestion();
    } else {
      stopTimer();
      picture.innerHTML = "<span style='font-size:70px'>Great job!</span>";
      progress.textContent = "";
      timerDisplay.textContent = "";
      message.textContent = `Game over! You scored ${score} out of ${gameQuestions.length}.`;
      nextButton.hidden = true;
      startButton.hidden = false;
      startButton.textContent = "Play Again";
    }
  });
</script>
</body>
</html>
